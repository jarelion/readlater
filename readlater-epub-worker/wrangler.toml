name = "readlater-epub"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Create with: wrangler kv namespace create RLE_KV
# then paste the id it prints below.
kv_namespaces = [
  { binding = "RLE_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# Optional: automatic digest build. Uncomment and adjust the schedule
# (cron syntax, UTC) once you've added feeds via /api/config or the webapp.
# [triggers]
# crons = ["0 7 * * *"]  # daily at 07:00 UTC
